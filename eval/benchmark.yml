# Meridian evaluation benchmark
#
# 50 questions with known-correct answers, used to score both the baseline
# template agent (phase 5) and the LLM agent (phase 6) on identical inputs.
#
# SCORING (phase 8):
#   Primary   result_accuracy — does the returned value match expected,
#             within tolerance. This is the headline number.
#   Diagnostic  table choice, filter application, grain handling. These
#             explain WHY the primary number is what it is, and separate
#             a correct answer from a lucky one.
#
# Fields:
#   id                 stable identifier
#   question           natural language, as a user would type it
#   difficulty         easy | medium | hard
#   category           what capability the question exercises
#   template_covered   whether the phase 5 baseline can answer it.
#                      ~40% are false by design — those are what the LLM
#                      has to earn.
#   reference_sql      the correct query
#   expected           the correct answer (scalar, or row count for lists)
#   tolerance          absolute tolerance for float comparison
#   required_tables    tables a correct answer must query
#   required_filters   semantic requirements the query must satisfy
#   notes              why the question is interesting or what it traps

version: 1

questions:

  # -- Tier 1: single table, single aggregate -------------------------

  - id: Q001
    question: What is our total revenue?
    difficulty: easy
    category: simple_aggregate
    template_covered: true
    reference_sql: |
      select round(sum(line_total_ex_outliers), 2) as revenue
      from gold.fct_order_items
      where is_completed
    expected: 92541205.45
    tolerance: 0.01
    required_tables: [gold.fct_order_items]
    required_filters: [is_completed, excludes_outliers]
    notes: >
      Tests whether the agent applies the default revenue measure. Answering
      741193240.52 means it summed line_total with no filters.

  - id: Q002
    question: How many orders have been placed?
    difficulty: easy
    category: simple_aggregate
    template_covered: true
    reference_sql: |
      select count(*) as orders from gold.fct_orders
    expected: 99500
    tolerance: 0
    required_tables: [gold.fct_orders]
    notes: >
      Grain trap. Counting from fct_order_items gives 228849 — line items,
      not orders.

