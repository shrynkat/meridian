  # -- Tier 5: multi-step reasoning ------------------------------------

  - id: Q029
    question: What is our month-over-month revenue growth rate?
    difficulty: hard
    category: multi_step
    template_covered: false
    reference_sql: |
      with monthly as (
          select order_month, sum(line_total_ex_outliers) as rev
          from gold.fct_order_items
          where is_completed
          group by 1
      )
      select
          order_month,
          round(rev, 2) as revenue,
          round((rev - lag(rev) over (order by order_month))
                / nullif(lag(rev) over (order by order_month), 0) * 100, 2) as growth_pct
      from monthly
      order by order_month
    expected_row_count: 42
    tolerance: 0
    required_tables: [gold.fct_order_items]
    required_filters: [is_completed, excludes_outliers, window_function]

  - id: Q030
    question: Which products are most often bought together?
    difficulty: hard
    category: multi_step
    template_covered: false
    reference_sql: |
      select
          a.product_id as product_a,
          b.product_id as product_b,
          count(*) as times_together
      from gold.fct_order_items a
      join gold.fct_order_items b
        on a.order_id = b.order_id
       and a.product_id < b.product_id
      group by 1, 2
      order by times_together desc
      limit 10
    expected_row_count: 10
    tolerance: 0
    required_tables: [gold.fct_order_items]
    notes: >
      Self-join on order_id with an inequality to avoid counting each pair
      twice. This is the query most likely to be written wrong.

